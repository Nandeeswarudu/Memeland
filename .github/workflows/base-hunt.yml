name: Base hunt scanner

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      max_blocks:
        description: 'Blocks to scan in this run'
        required: false
        default: '10000'

permissions:
  contents: write

concurrency:
  group: base-hunt-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the next Base block range
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          python -u scripts/run_chunk.py \
            --max-blocks "${{ inputs.max_blocks || '10000' }}" \
            --rpc-range 5 \
            --rpc-url "$BASE_RPC_URL"

      - name: Save findings and progress
        if: always()
        run: |
          git config user.name "base-hunt-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== Git status before saving ==="
          git status --short

          # Only persist these scanner files.
          git add data/state.json data/shortlist.json

          if git diff --staged --quiet; then
            echo "No changes to state or shortlist."
          else
            git commit -m "scanner: save findings and progress [skip ci]"
          fi

          echo "=== Git status after commit ==="
          git status --short

          # Preserve any remaining working-tree changes so the rebase
          # cannot fail because of unstaged files.
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Stashing remaining working-tree changes..."
            git stash push -u -m "scanner runtime changes"
          else
            echo "Working tree is clean."
          fi

          echo "=== Fetching latest main ==="
          git fetch origin main

          echo "=== Rebasing onto origin/main ==="
          git rebase origin/main

          echo "=== Pushing scanner progress ==="
          git push origin HEAD:main
