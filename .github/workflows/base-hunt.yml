name: Base hunt scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      max_blocks:
        description: 'Blocks to scan in this run'
        required: false
        default: '10000'

permissions:
  contents: write

concurrency:
  group: base-hunt-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the next Base block range
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          python -u scripts/run_chunk.py \
            --max-blocks "${{ inputs.max_blocks || '10000' }}" \
            --rpc-range 5 \
            --rpc-url "$BASE_RPC_URL"

      - name: Save findings and progress
        if: always()
        run: |
          git config user.name "base-hunt-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only commit the files that need to persist between runs.
          # DO NOT add data/mint_events.jsonl.
          git add data/state.json data/shortlist.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "scanner: save findings and progress [skip ci]"

          # Get the latest main branch.
          git fetch origin main

          # Rebase our scanner progress onto the latest remote state.
          git rebase origin/main

          # Push the updated state.
          git push origin HEAD:main
