name: Base hunt scanner

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      max_blocks:
        description: 'Blocks to scan in this run'
        required: false
        default: '1000'

permissions:
  contents: write

concurrency:
  group: base-hunt-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the next Base block range
        run: |
          python -u scripts/run_chunk.py \
            --max-blocks "${{ inputs.max_blocks || '1000' }}" \
            --rpc-range 50

      - name: Save findings and progress
        if: always()
        run: |
          git config user.name "base-hunt-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json data/shortlist.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "scanner: save findings and progress [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Successfully pushed changes."
                exit 0
              fi
            else
              echo "Rebase conflict detected."
              git rebase --abort || true

              git fetch origin main
              git reset --soft origin/main

              git add data/state.json data/shortlist.json

              if git diff --staged --quiet; then
                echo "No changes remain after synchronization."
                exit 0
              fi

              git commit -m "scanner: save findings and progress [skip ci]"
            fi

            echo "Attempt $attempt failed. Retrying in 2 seconds..."
            sleep 2
          done

          echo "ERROR: Failed to push after 5 attempts."
          exit 1
