name: Base hunt scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      max_blocks:
        description: 'Blocks to scan in this run'
        required: false
        default: '10000'

permissions:
  contents: write

concurrency:
  group: base-hunt-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the next Base block range
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          python -u scripts/run_chunk.py \
            --max-blocks "${{ inputs.max_blocks || '10000' }}" \
            --rpc-range 5 \
            --rpc-url "$BASE_RPC_URL"

      - name: Save findings and progress
        if: always()
        run: |
          set -e

          git config user.name "base-hunt-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== Git status before commit ==="
          git status --short

          # Persist only scanner state and shortlist.
          git add data/state.json data/shortlist.json

          if git diff --staged --quiet; then
            echo "No changes to state or shortlist."
          else
            git commit -m "scanner: save findings and progress [skip ci]"
          fi

          # Remove generated runtime files that are intentionally not persisted.
          rm -f data/contract_creation_cache.json

          # Ensure the working tree/index are clean.
          git reset --hard HEAD
          git clean -fd
          git update-index --refresh

          echo "=== Git status before sync ==="
          git status --short

          # Get the latest main branch.
          git fetch origin main

          # Merge latest remote main instead of rebasing.
          # The scanner's newly committed state/shortlist wins if those
          # files conflict, preventing the historical scan position from
          # being overwritten by another main-branch update.
          git merge origin/main --no-edit -X ours

          # Push the combined result.
          git push origin HEAD:main
