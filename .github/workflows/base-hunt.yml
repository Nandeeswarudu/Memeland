name: Base hunt scanner

on:
  schedule:
    # Every five minutes, offset from the busy start of the hour.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      max_blocks:
        description: 'Blocks to scan in this run (5000 is the safe free-RPC default)'
        required: false
        default: '5000'

permissions:
  contents: write

concurrency:
  group: base-hunt-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Scan the next Base block range
        run: python scripts/run_chunk.py --max-blocks "${{ inputs.max_blocks || '5000' }}"
      - name: Save findings and progress
        run: |
          git config user.name "base-hunt-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "scanner: save findings and progress [skip ci]"
          git push
